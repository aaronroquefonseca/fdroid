name: publish

# App release workflows upload a signed APK to R2 incoming/, then start this
# with `gh workflow run publish.yml`. One publisher at a time: runs queue.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: publish
  # A queued run publishes everything in incoming/, so GitHub replacing an
  # older queued run with a newer one loses nothing.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install fdroidserver
        run: pipx install fdroidserver==2.4.5
      - name: Restore repo keystore
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
        run: echo "$FDROID_KEYSTORE_B64" | base64 -d > keystore.p12
      - name: Publish
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: ./publish.sh
      - if: always()
        run: rm -f keystore.p12
